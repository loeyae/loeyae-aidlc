<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="280" y="187">工作区检测、需求分析、用户故事</tspan><tspan x="280" y="203">提交主分支</tspan></text>
</g>
<g id="node-architect">
