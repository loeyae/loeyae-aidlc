<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="595" y="155">拉取产出物</tspan></text>
</g>
</g>
<g id="nodes">
