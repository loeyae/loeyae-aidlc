<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="920" y="151">Architect 会话</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="920" y="177">拉取产出物、应用设计</tspan><tspan x="920" y="193">单元生成、工作流规划</tspan><tspan x="920" y="209">提交主分支</tspan></text>
</g>
<g id="node-dev-a">
