<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 610" width="1240" height="610" role="img" aria-labelledby="best-practices-single-module-team-title best-practices-single-module-team-desc">
<title id="best-practices-single-module-team-title">单模块团队协作工作流（历史最佳实践）</title>
<desc id="best-practices-single-module-team-desc">PM 与 Architect 在集中 Inception 中接力，随后多个开发者在 Construction 中按单元独立工作并合并 PR。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1240" height="610" fill="#ffffff"/>
<text x="620" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">单模块团队协作工作流（历史最佳实践）</text>
<g id="groups">
<g id="group-inception">
<rect x="75" y="55" width="1090" height="220" rx="12" fill="#e0f2fe" fill-opacity="0.52" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="91" y="79" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">Inception（集中）</text>
</g>
<g id="group-construction">
<rect x="75" y="355" width="1090" height="180" rx="12" fill="#f1f5f9" fill-opacity="0.52" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="91" y="379" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#334155">Construction（分布）</text>
</g>
</g>
<g id="connectors">
<polyline data-edge="pm-architect" data-from="pm" data-from-port="right" data-to="architect" data-to-port="left" data-kind="directed" points="410,185 780,185" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="architect-dev-a" data-from="architect" data-from-port="bottom" data-to="dev-a" data-to-port="top" data-kind="directed" points="920,245 920,320 245,320 245,410" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="architect-dev-b" data-from="architect" data-from-port="bottom" data-to="dev-b" data-to-port="top" data-kind="directed" points="920,245 920,320 620,320 620,410" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="architect-dev-c" data-from="architect" data-from-port="bottom" data-to="dev-c" data-to-port="top" data-kind="directed" points="920,245 995,320 995,410" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="dev-a-merge" data-from="dev-a" data-from-port="bottom" data-to="merge" data-to-port="top" data-kind="directed" points="245,505 245,535 620,535 620,550" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="dev-b-merge" data-from="dev-b" data-from-port="bottom" data-to="merge" data-to-port="top" data-kind="directed" points="620,505 620,550" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="dev-c-merge" data-from="dev-c" data-from-port="bottom" data-to="merge" data-to-port="top" data-kind="directed" points="995,505 995,535 620,535 620,550" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
