<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="245" y="436">Developer A</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="245" y="462">认领 unit-1</tspan><tspan x="245" y="478">feat/unit-1</tspan></text>
</g>
<g id="node-dev-b">
<g data-node="dev-b" fill="#f8fafc" stroke="#334155" stroke-width="2"><circle cx="620" cy="428" r="14"/><rect x="525" y="446" width="190" height="59" rx="8"/></g>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="620" y="436">Developer B</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="620" y="462">认领 unit-2</tspan><tspan x="620" y="478">feat/unit-2</tspan></text>
</g>
<g id="node-dev-c">
<g data-node="dev-c" fill="#f8fafc" stroke="#334155" stroke-width="2"><circle cx="995" cy="428" r="14"/><rect x="900" y="446" width="190" height="59" rx="8"/></g>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="995" y="436">Developer C</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="995" y="462">认领 unit-3</tspan><tspan x="995" y="478">feat/unit-3</tspan></text>
</g>
<g id="node-merge">
<rect data-node="merge" fill="#dcfce7" stroke="#15803d" stroke-width="2" x="470" y="550" width="300" height="50" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="620" y="580">PR 合并到主分支</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
