<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="clarification-decision-tree-title clarification-decision-tree-desc">
<title id="clarification-decision-tree-title">需求澄清依赖树（历史示例）</title>
<desc id="clarification-decision-tree-desc">先回答核心问题 Q1，再根据答案回答 Q2 和 Q3，形成依赖式澄清链。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1080" height="560" fill="#ffffff"/>
<text x="540" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">需求澄清依赖树（历史示例）</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="request-q1" data-from="request" data-from-port="bottom" data-to="q1" data-to-port="top" data-kind="directed" points="540,108 540,165" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="q1-q2" data-from="q1" data-from-port="bottom" data-to="q2" data-to-port="top" data-kind="directed" points="540,255 540,315" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="q2-q3" data-from="q2" data-from-port="bottom" data-to="q3" data-to-port="top" data-kind="directed" points="540,405 540,465" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="q2-answers" data-from="q2" data-from-port="right" data-to="answers" data-to-port="left" data-kind="dashed" points="670,360 755,347.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="q1-q2">
<rect x="502" y="273" width="76" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="540" y="290">确认 Q1</tspan></text>
</g>
<g data-edge-label="q2-q3">
<rect x="502" y="423" width="76" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="540" y="440">确认 Q2</tspan></text>
</g>
<g data-edge-label="q2-answers">
<rect x="703" y="338" width="64" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="735" y="355">提问格式</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-request">
<rect data-node="request" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="390" y="50" width="300" height="58" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="540" y="84">用户需求：原始描述</tspan></text>
</g>
<g id="node-q1">
<polygon data-node="q1" fill="#f8fafc" stroke="#334155" stroke-width="2" points="540,165 670,210 540,255 410,210"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="540" y="215">Q1：核心问题 1</tspan></text>
</g>
<g id="node-q2">
<polygon data-node="q2" fill="#f8fafc" stroke="#334155" stroke-width="2" points="540,315 670,360 540,405 410,360"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="540" y="365">Q2：依赖 Q1 答案</tspan></text>
</g>
<g id="node-q3">
<polygon data-node="q3" fill="#dcfce7" stroke="#15803d" stroke-width="2" points="540,465 670,500 540,535 410,500"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="540" y="505">Q3：依赖 Q2 答案</tspan></text>
</g>
<g id="node-answers">
<path data-node="answers" fill="#f1f5f9" stroke="#64748b" stroke-width="2" d="M 755 285 H 985 L 1005 305 V 410 H 755 Z M 985 285 V 305 H 1005"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="880" y="311">每题提供推荐选项</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#334155"><tspan x="880" y="337">A：选项 1 / 选项 2 / 选项 3</tspan><tspan x="880" y="353">后续问题只依赖已确认答案</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
