<polyline data-edge="base-merge" data-from="base" data-from-port="bottom" data-to="merge" data-to-port="top" data-kind="directed" points="210,495 210,520 620,520 620,535" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="business-a-merge" data-from="business-a" data-from-port="bottom" data-to="merge" data-to-port="top" data-kind="directed" points="620,495 620,535" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
