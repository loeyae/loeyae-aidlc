<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-labelledby="best-practices-multi-module-team-title best-practices-multi-module-team-desc">
<title id="best-practices-multi-module-team-title">多模块团队协作工作流（历史最佳实践）</title>
<desc id="best-practices-multi-module-team-desc">团队先完成轻量产品级 Inception，再让基础模块优先完成，两个业务模块从模块级 Inception 并行进入 Construction。</desc>
<defs>
