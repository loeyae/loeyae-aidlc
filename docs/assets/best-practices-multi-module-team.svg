<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1240" height="600" fill="#ffffff"/>
<text x="620" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">多模块团队协作工作流（历史最佳实践）</text>
<g id="groups">
</g>
