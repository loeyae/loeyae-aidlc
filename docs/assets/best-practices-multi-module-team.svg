<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="620" y="107">工作区检测 → 产品需求概览</tspan><tspan x="620" y="123">模块划分 → 模块间接口契约</tspan><tspan x="620" y="139">产出：product-overview.md + modules.md + contracts.md</tspan></text>
