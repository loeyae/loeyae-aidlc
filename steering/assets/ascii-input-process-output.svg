<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 590" width="700" height="590" role="img" aria-labelledby="ascii-input-process-output-title ascii-input-process-output-desc">
<title id="ascii-input-process-output-title">带标签垂直流程示例</title>
<desc id="ascii-input-process-output-desc">输入经过处理后返回输出的垂直流程。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="700" height="590" fill="#ffffff"/>
<text x="350" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">带标签垂直流程示例</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="input-process" data-from="input" data-from-port="bottom" data-to="process" data-to-port="top" data-kind="directed" points="350,160 350,265" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="process-output" data-from="process" data-from-port="bottom" data-to="output" data-to-port="top" data-kind="directed" points="350,325 350,430" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="input-process">
<rect x="288" y="208" width="124" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="350" y="225">validates</tspan></text>
</g>
<g data-edge-label="process-output">
<rect x="300" y="373" width="100" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="350" y="390">returns</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-input">
<rect data-node="input" fill="#f8fafc" stroke="#334155" stroke-width="2" x="255" y="100" width="190" height="60" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="350" y="135">Input</tspan></text>
</g>
<g id="node-process">
<rect data-node="process" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="255" y="265" width="190" height="60" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="350" y="300">Process</tspan></text>
</g>
<g id="node-output">
<rect data-node="output" fill="#dcfce7" stroke="#15803d" stroke-width="2" x="255" y="430" width="190" height="60" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="350" y="465">Output</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
