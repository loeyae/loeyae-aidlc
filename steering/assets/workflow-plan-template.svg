<polyline data-edge="application-functional" data-from="application" data-from-port="bottom" data-to="functional" data-to-port="top" data-kind="directed" points="1010,255 460,450" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
