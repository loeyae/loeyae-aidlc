<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-labelledby="workflow-plan-template-title workflow-plan-template-desc">
<title id="workflow-plan-template-title">执行计划 SVG 模板</title>
<desc id="workflow-plan-template-desc">Inception 与 Construction 阶段的执行计划和依赖关系模板。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1180" height="640" fill="#ffffff"/>
<text x="590" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">执行计划 SVG 模板</text>
<g id="groups">
<g id="group-inception">
<rect x="90" y="115" width="1000" height="200" rx="12" fill="#e0f2fe" fill-opacity="0.52" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="106" y="139" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">Inception 阶段</text>
</g>
<g id="group-construction">
