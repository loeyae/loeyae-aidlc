<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" width="1120" height="570" role="img" aria-labelledby="compact-recovery-title compact-recovery-desc">
<title id="compact-recovery-title">Compact 恢复决策树</title>
<desc id="compact-recovery-desc">Compact 恢复时根据协调状态和交接提示决定下一步的流程。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1120" height="570" fill="#ffffff"/>
<text x="560" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">Compact 恢复决策树</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="compact-state" data-from="compact" data-from-port="bottom" data-to="state" data-to-port="top" data-kind="directed" points="545,105 545,155" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="state-coordination" data-from="state" data-from-port="bottom" data-to="coordination" data-to-port="top" data-kind="directed" points="545,210 545,265" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="coordination-restore" data-from="coordination" data-from-port="left" data-to="restore" data-to-port="top" data-kind="directed" points="430,312.5 190,420" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="coordination-handoff" data-from="coordination" data-from-port="bottom" data-to="handoff" data-to-port="top" data-kind="directed" points="545,360 545,405" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="handoff-prompt" data-from="handoff" data-from-port="right" data-to="prompt" data-to-port="left" data-kind="directed" points="650,450 765,375" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="handoff-current" data-from="handoff" data-from-port="right" data-to="current" data-to-port="left" data-kind="directed" points="650,450 765,510" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="restore-continue" data-from="restore" data-from-port="right" data-to="continue" data-to-port="left" data-kind="directed" points="280,450 440,537.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="prompt-continue" data-from="prompt" data-from-port="bottom" data-to="continue" data-to-port="right" data-kind="directed" points="855,405 650,537.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="current-continue" data-from="current" data-from-port="left" data-to="continue" data-to-port="right" data-kind="directed" points="765,510 650,537.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="coordination-restore">
<rect x="316" y="378" width="38" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="335" y="395">是</tspan></text>
</g>
<g data-edge-label="coordination-handoff">
<rect x="526" y="363" width="38" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="545" y="380">否</tspan></text>
</g>
<g data-edge-label="handoff-prompt">
<rect x="711" y="363" width="38" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="730" y="380">是</tspan></text>
</g>
<g data-edge-label="handoff-current">
<rect x="711" y="453" width="38" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="730" y="470">否</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-compact">
<rect data-node="compact" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="450" y="50" width="190" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="545" y="82.5">Compact 恢复</tspan></text>
</g>
<g id="node-state">
<rect data-node="state" fill="#f8fafc" stroke="#334155" stroke-width="2" x="450" y="155" width="190" height="55" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="545" y="187.5">读取 state.md</tspan></text>
</g>
<g id="node-coordination">
<polygon data-node="coordination" fill="#fef3c7" stroke="#b45309" stroke-width="2" points="545,265 660,312.5 545,360 430,312.5"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#78350f"><tspan x="545" y="317.5">有活跃协调状态？</tspan></text>
</g>
<g id="node-restore">
<rect data-node="restore" fill="#fef3c7" stroke="#b45309" stroke-width="2" x="100" y="420" width="180" height="60" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#78350f"><tspan x="190" y="455">恢复协调</tspan></text>
</g>
<g id="node-handoff">
<polygon data-node="handoff" fill="#f8fafc" stroke="#334155" stroke-width="2" points="545,405 650,450 545,495 440,450"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="545" y="455">有下一步交接提示？</tspan></text>
</g>
<g id="node-prompt">
<rect data-node="prompt" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="765" y="345" width="180" height="60" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="855" y="380">按提示恢复</tspan></text>
</g>
<g id="node-current">
<rect data-node="current" fill="#f8fafc" stroke="#334155" stroke-width="2" x="765" y="480" width="180" height="60" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="855" y="515">按当前步骤恢复</tspan></text>
</g>
<g id="node-continue">
<rect data-node="continue" fill="#dcfce7" stroke="#15803d" stroke-width="2" x="440" y="510" width="210" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="545" y="542.5">激活能力并继续</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
