<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="syntax-c4-component-title syntax-c4-component-desc">
<title id="syntax-c4-component-title">组件 SVG 模板</title>
<desc id="syntax-c4-component-desc">Controller、Service 和 Repository 的组件关系示例。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="980" height="420" fill="#ffffff"/>
<text x="490" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">组件 SVG 模板</text>
<g id="groups">
<g id="group-api-boundary">
<rect x="90" y="55" width="800" height="300" rx="12" fill="#e0f2fe" fill-opacity="0.52" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="106" y="79" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">API 服务</text>
</g>
</g>
<g id="connectors">
<polyline data-edge="controller-service" data-from="controller" data-from-port="right" data-to="service" data-to-port="left" data-kind="directed" points="335,220 405,220" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="service-repository" data-from="service" data-from-port="right" data-to="repository" data-to-port="left" data-kind="directed" points="595,220 665,220" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="controller-service">
<rect x="350" y="144" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="370" y="161">调用</tspan></text>
</g>
<g data-edge-label="service-repository">
<rect x="610" y="144" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="630" y="161">调用</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-controller">
<rect data-node="controller" fill="#f8fafc" stroke="#334155" stroke-width="2" x="145" y="170" width="190" height="100" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="240" y="196">Controller</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="240" y="222">Spring MVC</tspan></text>
</g>
<g id="node-service">
<rect data-node="service" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="405" y="170" width="190" height="100" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="500" y="196">Service</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="500" y="222">业务逻辑</tspan></text>
</g>
<g id="node-repository">
<rect data-node="repository" fill="#f8fafc" stroke="#334155" stroke-width="2" x="665" y="170" width="170" height="100" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="750" y="196">Repository</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="750" y="222">数据访问</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
