<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="tdd-cycle-title tdd-cycle-desc">
<title id="tdd-cycle-title">RED-GREEN-REFACTOR 循环</title>
<desc id="tdd-cycle-desc">失败测试、最小实现、重构和下一测试组成的 TDD 循环。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1040" height="470" fill="#ffffff"/>
<text x="520" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">RED-GREEN-REFACTOR 循环</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="red-green" data-from="red" data-from-port="right" data-to="green" data-to-port="left" data-kind="directed" points="255,222.5 390,222.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="green-refactor" data-from="green" data-from-port="right" data-to="refactor" data-to-port="left" data-kind="directed" points="550,222.5 685,222.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="refactor-next" data-from="refactor" data-from-port="bottom" data-to="next" data-to-port="right" data-kind="directed" points="775,265 580,370" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="next-red" data-from="next" data-from-port="left" data-to="red" data-to-port="bottom" data-kind="dashed" points="410,370 175,265" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="red-green">
<rect x="288" y="148" width="64" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="320" y="165">修正代码</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-red">
<rect data-node="red" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" x="95" y="180" width="160" height="85" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#7f1d1d"><tspan x="175" y="206">RED</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#7f1d1d"><tspan x="175" y="232">验证失败</tspan></text>
</g>
<g id="node-green">
<rect data-node="green" fill="#dcfce7" stroke="#15803d" stroke-width="2" x="390" y="180" width="160" height="85" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="470" y="206">GREEN</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#14532d"><tspan x="470" y="232">验证通过</tspan></text>
</g>
<g id="node-refactor">
<rect data-node="refactor" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="685" y="180" width="180" height="85" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="775" y="206">REFACTOR</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="775" y="232">保持测试绿色</tspan></text>
</g>
<g id="node-next">
<path data-node="next" fill="#f1f5f9" stroke="#64748b" stroke-width="2" d="M 410 340 H 565 L 580 355 V 400 H 410 Z M 565 340 V 355 H 580"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="495" y="375">下一个测试</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
