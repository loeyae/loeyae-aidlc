<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="requirements-state-template-title requirements-state-template-desc">
<title id="requirements-state-template-title">需求状态图模板</title>
<desc id="requirements-state-template-desc">草稿、已提交、已审批和已拒绝之间的状态迁移模板。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">需求状态图模板</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="start-draft" data-from="start" data-from-port="right" data-to="draft" data-to-port="left" data-kind="directed" points="140,217.5 205,212.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="draft-submitted" data-from="draft" data-from-port="right" data-to="submitted" data-to-port="left" data-kind="directed" points="345,212.5 425,212.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="submitted-approved" data-from="submitted" data-from-port="right" data-to="approved" data-to-port="left" data-kind="directed" points="565,212.5 680,122.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="submitted-rejected" data-from="submitted" data-from-port="right" data-to="rejected" data-to-port="left" data-kind="directed" points="565,212.5 680,312.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="rejected-draft" data-from="rejected" data-from-port="left" data-to="draft" data-to-port="bottom" data-kind="dashed" points="680,312.5 275,240" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline data-edge="approved-end" data-from="approved" data-from-port="right" data-to="end" data-to-port="left" data-kind="directed" points="820,122.5 875,122.5" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="start-draft">
<rect x="155" y="163" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="175" y="180">创建</tspan></text>
</g>
<g data-edge-label="draft-submitted">
<rect x="365" y="163" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="385" y="180">提交</tspan></text>
</g>
<g data-edge-label="submitted-approved">
<rect x="588" y="143" width="64" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="620" y="160">审批通过</tspan></text>
</g>
<g data-edge-label="submitted-rejected">
<rect x="588" y="258" width="64" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="620" y="275">审批拒绝</tspan></text>
</g>
<g data-edge-label="rejected-draft">
<rect x="415" y="353" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="435" y="370">修改</tspan></text>
</g>
<g data-edge-label="approved-end">
<rect x="830" y="73" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="850" y="90">完成</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-start">
<ellipse data-node="start" fill="#f1f5f9" stroke="#64748b" stroke-width="2" cx="92.5" cy="217.5" rx="47.5" ry="22.5"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="92.5" y="222.5">开始</tspan></text>
</g>
<g id="node-draft">
<rect data-node="draft" fill="#f8fafc" stroke="#334155" stroke-width="2" x="205" y="185" width="140" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="275" y="217.5">草稿</tspan></text>
</g>
<g id="node-submitted">
<rect data-node="submitted" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="425" y="185" width="140" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="495" y="217.5">已提交</tspan></text>
</g>
<g id="node-approved">
<rect data-node="approved" fill="#dcfce7" stroke="#15803d" stroke-width="2" x="680" y="95" width="140" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="750" y="127.5">已审批</tspan></text>
</g>
<g id="node-rejected">
<rect data-node="rejected" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" x="680" y="285" width="140" height="55" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#7f1d1d"><tspan x="750" y="317.5">已拒绝</tspan></text>
</g>
<g id="node-end">
<ellipse data-node="end" fill="#dcfce7" stroke="#15803d" stroke-width="2" cx="920" cy="122.5" rx="45" ry="22.5"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#14532d"><tspan x="920" y="127.5">完成</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
