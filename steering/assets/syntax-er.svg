<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="syntax-er-title syntax-er-desc">
<title id="syntax-er-title">ER 图 SVG 模板</title>
<desc id="syntax-er-desc">订单与订单明细的一对多关系示例。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="960" height="420" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">ER 图 SVG 模板</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="order-items" data-from="order" data-from-port="right" data-to="item" data-to-port="left" data-kind="undirected" points="370,185 590,185" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
</g>
<g id="edge-labels">
<g data-edge-label="order-items">
<rect x="382" y="148" width="196" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="480" y="165">1 对多 · contains</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-order">
<rect data-node="order" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="130" y="110" width="240" height="150" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="250" y="136">ORDER</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="250" y="162">id · PK</tspan><tspan x="250" y="178">status</tspan></text>
</g>
<g id="node-item">
<rect data-node="item" fill="#f8fafc" stroke="#334155" stroke-width="2" x="590" y="110" width="240" height="150" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="710" y="136">ORDER_ITEM</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0f172a"><tspan x="710" y="162">id · PK</tspan><tspan x="710" y="178">order_id · FK</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
