<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="syntax-class-title syntax-class-desc">
<title id="syntax-class-title">类图 SVG 模板</title>
<desc id="syntax-class-desc">订单服务依赖订单仓储的类关系示例。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="960" height="400" fill="#ffffff"/>
<text x="480" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">类图 SVG 模板</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="service-repository" data-from="service" data-from-port="right" data-to="repository" data-to-port="left" data-kind="directed" points="395,175 590,155" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="service-repository">
<rect x="475" y="138" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="495" y="155">依赖</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-service">
<rect data-node="service" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" x="135" y="110" width="260" height="130" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="265" y="136">OrderService</tspan></text>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#0c4a6e"><tspan x="265" y="162">+ createOrder()</tspan></text>
</g>
<g id="node-repository">
<rect data-node="repository" fill="#f8fafc" stroke="#334155" stroke-width="2" x="590" y="110" width="240" height="90" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="710" y="160">OrderRepository</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
