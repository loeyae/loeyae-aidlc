<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-labelledby="mermaid-delivery-flow-title mermaid-delivery-flow-desc">
<title id="mermaid-delivery-flow-title">交付型业务流程示例</title>
<desc id="mermaid-delivery-flow-desc">开始、步骤和判断组成的 SVG 业务流程示例。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
</marker>
</defs>
<rect width="920" height="410" fill="#ffffff"/>
<text x="460" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">交付型业务流程示例</text>
<g id="groups">
</g>
<g id="connectors">
<polyline data-edge="start-step" data-from="start" data-from-port="bottom" data-to="step" data-to-port="top" data-kind="directed" points="415,107 415,165" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="step-check" data-from="step" data-from-port="right" data-to="check" data-to-port="left" data-kind="directed" points="485,191 650,190" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<polyline data-edge="check-done" data-from="check" data-from-port="bottom" data-to="done" data-to-port="right" data-kind="directed" points="740,230 485,326" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/>
</g>
<g id="edge-labels">
<g data-edge-label="check-done">
<rect x="615" y="275" width="40" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#334155"><tspan x="635" y="292">通过</tspan></text>
</g>
</g>
<g id="nodes">
<g id="node-start">
<rect data-node="start" fill="#f8fafc" stroke="#334155" stroke-width="2" x="345" y="55" width="140" height="52" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="415" y="86">开始</tspan></text>
</g>
<g id="node-step">
<rect data-node="step" fill="#f8fafc" stroke="#334155" stroke-width="2" x="345" y="165" width="140" height="52" rx="6"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="415" y="196">步骤</tspan></text>
</g>
<g id="node-done">
<rect data-node="done" fill="#f8fafc" stroke="#334155" stroke-width="2" x="345" y="300" width="140" height="52" rx="24"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a"><tspan x="415" y="331">完成</tspan></text>
</g>
<g id="node-check">
<polygon data-node="check" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" points="740,150 830,190 740,230 650,190"/>
<text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0c4a6e"><tspan x="740" y="195">是否通过</tspan></text>
</g>
</g>
<g id="annotations">
</g>
</svg>
